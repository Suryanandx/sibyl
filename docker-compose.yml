services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    env_file:
      - ${OPEN_GPT_LIVE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      SIBYL_SLIDES_URL: ${SIBYL_SLIDES_URL:-http://slides:8000}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8787
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8787:8787"
    volumes:
      # Call recordings (Sibyl Enterprise), written by egress into the same volume.
      - recordings:/app/data/recordings
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        SIBYL_SLIDES_WEB_URL: http://slides:3100
        NEXT_PUBLIC_GATEWAY_WS_URL: ${NEXT_PUBLIC_GATEWAY_WS_URL:-ws://localhost:8787}
        NEXT_PUBLIC_VAD_ADAPTIVE_ENABLED: ${NEXT_PUBLIC_VAD_ADAPTIVE_ENABLED:-true}
        NEXT_PUBLIC_VAD_CALIBRATION_MS: ${NEXT_PUBLIC_VAD_CALIBRATION_MS:-1000}
        NEXT_PUBLIC_VAD_NOISE_FLOOR_SMOOTHING: ${NEXT_PUBLIC_VAD_NOISE_FLOOR_SMOOTHING:-0.08}
        NEXT_PUBLIC_VAD_SPEECH_NOISE_MULTIPLIER: ${NEXT_PUBLIC_VAD_SPEECH_NOISE_MULTIPLIER:-3}
        NEXT_PUBLIC_VAD_SILENCE_NOISE_MULTIPLIER: ${NEXT_PUBLIC_VAD_SILENCE_NOISE_MULTIPLIER:-1.8}
        NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MIN: ${NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MIN:-0.012}
        NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MAX: ${NEXT_PUBLIC_VAD_DYNAMIC_SPEECH_MAX:-0.12}
        NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MIN: ${NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MIN:-0.006}
        NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MAX: ${NEXT_PUBLIC_VAD_DYNAMIC_SILENCE_MAX:-0.08}
        NEXT_PUBLIC_VAD_SPEECH_THRESHOLD: ${NEXT_PUBLIC_VAD_SPEECH_THRESHOLD:-0.02}
        NEXT_PUBLIC_VAD_SILENCE_THRESHOLD: ${NEXT_PUBLIC_VAD_SILENCE_THRESHOLD:-0.012}
        NEXT_PUBLIC_VAD_START_DEBOUNCE_MS: ${NEXT_PUBLIC_VAD_START_DEBOUNCE_MS:-160}
        NEXT_PUBLIC_VAD_MIN_SPEECH_MS: ${NEXT_PUBLIC_VAD_MIN_SPEECH_MS:-200}
        NEXT_PUBLIC_VAD_HANGOVER_MS: ${NEXT_PUBLIC_VAD_HANGOVER_MS:-400}
        NEXT_PUBLIC_VAD_MAX_TURN_MS: ${NEXT_PUBLIC_VAD_MAX_TURN_MS:-30000}
        NEXT_PUBLIC_VAD_PRE_ROLL_MS: ${NEXT_PUBLIC_VAD_PRE_ROLL_MS:-400}
        NEXT_PUBLIC_VAD_PLAYBACK_THRESHOLD_MULTIPLIER: ${NEXT_PUBLIC_VAD_PLAYBACK_THRESHOLD_MULTIPLIER:-2.5}
        NEXT_PUBLIC_VAD_PLAYBACK_SUPPRESS_AFTER_END_MS: ${NEXT_PUBLIC_VAD_PLAYBACK_SUPPRESS_AFTER_END_MS:-300}
    depends_on:
      gateway:
        condition: service_healthy
      slides:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Sibyl Slides: deck engine (FastAPI :8000, reached by the gateway at
  # SIBYL_SLIDES_URL) and the slide editor (:3100, served to browsers by the
  # web app at /slides). Not published on the host: the web app and the
  # gateway reach it on the compose network.
  slides:
    build:
      context: .
      dockerfile: Dockerfile.slides
    env_file:
      - ${OPEN_GPT_LIVE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      SIBYL_SLIDES_HOST: 0.0.0.0
      SIBYL_SLIDES_MODEL: ${SIBYL_SLIDES_MODEL:-}
      SIBYL_SLIDES_IMAGE_PROVIDER: ${SIBYL_SLIDES_IMAGE_PROVIDER:-}
      # Where the editor's links back to the app go when it is opened directly.
      SIBYL_APP_URL: ${SIBYL_APP_URL:-http://localhost:3000}
      APP_DATA_DIRECTORY: /app_data
    volumes:
      - slides-data:/app_data
    expose:
      - "8000"
      - "3100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 4s
      retries: 8
      start_period: 60s

  # Agent computers: the sandbox image the gateway starts one container from
  # per agent (docs/agent-computers.md). Build it with
  #   docker compose --profile computers build computer
  # It is never run by Compose itself; the gateway starts and stops sandboxes.
  computer:
    profiles: ["computers"]
    build:
      context: .
      dockerfile: Dockerfile.computer
    image: sibyl-computer:1.64.1

  # ── Realtime layer (optional, docs/realtime.md) ──
  # docker compose --profile realtime up   → LiveKit + egress (recordings) + ingress (streams)
  # docker compose --profile phone up      → also the SIP bridge for phone calls
  # Then set LIVEKIT_URL=ws://livekit:7880, LIVEKIT_PUBLIC_URL=ws://localhost:7880,
  # LIVEKIT_API_KEY and LIVEKIT_API_SECRET in .env and restart the gateway.
  redis:
    image: redis:7-alpine
    profiles: ["realtime", "phone"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"

  livekit:
    image: livekit/livekit-server:v1.13.11
    profiles: ["realtime", "phone"]
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-sibyl}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis

  egress:
    image: livekit/egress:v1.15.0
    profiles: ["realtime"]
    # Headless Chrome needs its sandbox (LiveKit's documented setting).
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-sibyl}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        log_level: info
    volumes:
      # Same volume as the gateway's /app/data/recordings (SIBYL_RECORDINGS_EGRESS_DIR=/recordings).
      - recordings:/recordings
    depends_on:
      - livekit

  ingress:
    image: livekit/ingress:v1.6.0
    profiles: ["realtime"]
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-sibyl}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        rtmp_port: 1935
        whip_port: 8080
        http_relay_port: 9090
        rtc_config:
          udp_port: 7885
          use_external_ip: false
        logging:
          level: info
    ports:
      - "1935:1935"
      - "${INGRESS_WHIP_PORT:-8080}:8080"
      - "7885:7885/udp"
    depends_on:
      - livekit

  sip:
    image: livekit/sip:v1.23.0
    profiles: ["phone"]
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-sibyl}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: true
        logging:
          level: info
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10100:10000-10100/udp"
    depends_on:
      - livekit

volumes:
  slides-data:
  recordings:
