name: Terraform

# Format and validation checks for deploy/terraform. Applies are run by the
# owner from their machine (deploy/terraform/README.md), so no cloud or DNS
# credentials live in GitHub.

on:
  push:
    paths:
      - "deploy/terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "deploy/terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        stack: [bootstrap, site, email, app]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3

      - name: Format
        run: terraform fmt -check -recursive deploy/terraform

      - name: Validate ${{ matrix.stack }}
        working-directory: deploy/terraform/${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate
