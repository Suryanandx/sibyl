packages:
  - "apps/*"
  # Sibyl Slides uses its own npm + uv toolchain (apps/slides/start.mjs).
  - "!apps/slides"
  - "packages/*"
  # Sibyl Enterprise modules: their own dependencies, bundled into the gateway.
  - "ee"
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  '@openuidev/lang-core': false
  esbuild: true
