<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Sibyl</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161817" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="/assets/brand/sibyl-mark-light.png" />
  <script>
    try { var t = localStorage.getItem("sibyl-site-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/site.css" />
  <!-- Served by CloudFront for any missing page, so every link here is absolute. -->
</head>
<body>
  <main class="wrap" style="min-height: 80vh; display: flex; flex-direction: column; justify-content: center; gap: 1.25rem;">
    <p class="eyebrow">404</p>
    <h1 class="sectionTitle">This page isn't here.</h1>
    <p class="sectionLede">It may have moved, or the link has a typo. Everything Sibyl has is a click away from the home page.</p>
    <p style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
      <a class="btn btnInk" href="/">Home</a>
      <a class="btn btnLine" href="/docs/">Docs</a>
      <a class="btn btnLine" href="https://github.com/Suryanandx/sibyl">GitHub</a>
    </p>
  </main>
</body>
</html>
